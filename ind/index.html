<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторні роботи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #fff0f5;
            font-family: Arial, sans-serif;
            color: #583344;
        }
        header {
            background: #e88caf;
            color: white;
            padding: 22px;
            text-align: center;
        }
        .intro {
            text-align: center;
            padding: 45px 15px 25px;
        }
        .intro h1 {
            font-size: 38px;
            font-weight: bold;
            color: #c65380;
        }
        .intro p {
            color: #80576a;
            font-size: 18px;
        }
        .lab-card {
            background: white;
            border: none;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 15px #e8b6c9;
            transition: 0.3s;
            height: 100%;
        }
        .lab-card:hover {
            transform: translateY(-7px);
        }
        .lab-number {
            color: #d65b8b;
            font-size: 25px;
            font-weight: bold;
        }
        .btn-pink {
            background: #df78a0;
            color: white;
            border-radius: 25px;
            padding: 9px 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-pink:hover {
            background: #c65380;
            color: white;
        }
        #search {
            border: 2px solid #e8a2bd;
            border-radius: 25px;
            padding: 12px 20px;
        }
        #message {
            color: #c65380;
        }
    </style>
</head>
<body>
    <header>
        <h2>♡ Мій навчальний простір ♡</h2>
    </header>
    <section class="intro">
        <p>Тут зібрані мої лабораторні роботи з веброзробки</p>
    </section>
    <div class="container text-center mb-4">
        <input type="text" id="search" class="form-control w-50 mx-auto"  placeholder="Знайти лабораторну роботу...">
        <p id="message" class="mt-3"></p>
    </div>
    <main class="container">
        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="lab-card">
                    <div class="lab-number">№ 7</div>
                    <h4>Лабораторна робота</h4>
                    <p>Магічний шар 🔮</p>
                    <a href="https://kotenkoeva36-pixel.github.io/reposit/lab7/" class="btn-pink">Відкрити</a>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="lab-card">
                    <div class="lab-number">№ 8</div>
                    <h4>Лабораторна робота</h4>
                    <p>Рандомні числа💯</p>
                    <a href="https://kotenkoeva36-pixel.github.io/reposit/lab8/" class="btn-pink">Відкрити</a>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="lab-card">
                    <div class="lab-number">№ 9</div>
                    <h4>Лабораторна робота</h4>
                    <p>Карти "21"♠️❤</p>
                    <a href="https://kotenkoeva36-pixel.github.io/reposit/lab9/" class="btn-pink">Відкрити</a>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="lab-card">
                    <div class="lab-number">№ 10</div>
                    <h4>Лабораторна робота</h4>
                    <p>Казино 💵💰💸</p>
                    <a href="https://kotenkoeva36-pixel.github.io/reposit/lab10/" class="btn-pink">Відкрити</a>
                </div>
            </div>

        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        function searchLabs() {
            let value = document.getElementById("search").value;
            if (value.trim() === "") {
                document.getElementById("message").innerText =
                    "Введіть номер лабораторної роботи";
            } else {
                document.getElementById("message").innerText = "";
            }
        }
        $("#search").on("input", function() {
            let value = $(this).val().toLowerCase();
            $(".lab-card").each(function() {
                let text = $(this).text().toLowerCase();
                $(this).parent().toggle(text.includes(value));
            });
            if (value === "") {
                $("#message").text("");
            } else if ($(".lab-card:visible").length === 0) {
                $("#message").text("Нічого не знайдено");
            } else {
                $("#message").text("Знайдено лабораторні роботи");
            }
        });
    </script>
</body>
</html>
