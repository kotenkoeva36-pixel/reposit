<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Більше число</title>
<style>
* {
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 30px 15px;
    background: #f5f5f5;
}
.game {
    max-width: 650px;
    margin: 30px auto;
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 15px;
}
.player {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.name {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 5px;
}
.score {
    background: pink;
    width: 150px;
    padding: 10px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: bold;
}
.number {
    width: 120px;
    height: 120px;
    background: violet;
    border: 3px solid black;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: bold;
    margin-top: 15px;
}
button {
    background: lightblue;
    border: none;
    border-radius: 12px;
    padding: 17px 30px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background: #00cc00;
}
button:disabled {
    background: gray;
    cursor: not-allowed;
}
#message {
    font-size: 20px;
    margin: 20px;
    font-weight: bold;
}
@media (max-width: 500px) {
    .game {
        flex-direction: column;
    }
    .number {
        width: 100px;
        height: 100px;
    }
    button {
        margin: 15px;
    }
}
</style>
</head>
<body>
<div class="game">
    <div class="player">
        <div class="name" id="userName">User</div>
        <div class="score" id="userScore">0</div>
        <div class="number" id="userNumber">?</div>
    </div>
    <button id="generate" onclick="play()">Generate</button>
    <div class="player">
        <div class="name">Computer</div>
        <div class="score" id="computerScore">0</div>
        <div class="number" id="computerNumber">?</div>
    </div>
</div>
<div id="message">Натисніть Generate, щоб почати гру!</div>
<script>
let name = prompt("Введіть ваше ім'я:");
if (name === null || name.trim() === "") {
    name = "User";
}
document.getElementById("userName").textContent = name;
let userScore = 0,computerScore = 0;
function play() {
    let user = Math.floor(Math.random() * 10) + 1;
    let computer = Math.floor(Math.random() * 10) + 1;
    document.getElementById("userNumber").textContent = user;
    document.getElementById("computerNumber").textContent = computer;
    if (user> computer) {
        userScore++;
        document.getElementById("message").textContent =
            name + " переміг";
    }
    else if (computer > user) {
        computerScore++;
        document.getElementById("message").textContent =
            "Переміг комп'ютер";
    }
    else {
        document.getElementById("message").textContent =
            "Нічия, бали не нараховуються";
    }
    document.getElementById("userScore").textContent = userScore;
    document.getElementById("computerScore").textContent = computerScore;
    if (userScore === 3 || computerScore === 3) {
        let winner = userScore === 3 ? name : "Комп'ютер";
        document.getElementById("message").textContent ="Гру завершено Переможець: " + winner;
        document.getElementById("generate").disabled = true;
        document.getElementById("generate").textContent = "Гру завершено";
    }
}
</script>
</body>
</html>
